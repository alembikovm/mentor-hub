[project]
name = "mentor-hub-api"
version = "0.1.0"
description = "Mentor Hub API: roadmaps, submissions and LangGraph VLM screenshot review"
readme = "README.md"
authors = [
    { name = "Marat Alembikov", email = "alembikovm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
